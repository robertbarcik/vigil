<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vigil{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vigil: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex">
    <!-- Sidebar -->
    <nav class="w-64 bg-gray-900 border-r border-gray-800 min-h-screen p-6 flex flex-col">
        <div class="mb-10">
            <h1 class="text-2xl font-bold text-white tracking-tight">
                <span class="text-vigil-400">&#9673;</span> Vigil
            </h1>
            <p class="text-xs text-gray-500 mt-1">LLM Red-Teaming & Oversight</p>
        </div>

        <div class="space-y-1 flex-1">
            <a href="/" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 {% if active == 'dashboard' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
                <span>&#9632;</span> Dashboard
            </a>
            <a href="/redteam/runs" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 {% if active == 'redteam' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
                <span>&#9889;</span> Red Team
            </a>
            <a href="/oversight/sessions" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 {% if active == 'oversight' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
                <span>&#9678;</span> Human Review
            </a>
        </div>

        <div class="text-xs text-gray-600 pt-4 border-t border-gray-800">
            Vigil v0.1.0
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 p-8 overflow-auto">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/vigil.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
