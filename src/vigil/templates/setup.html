{% extends "base.html" %}
{% set active = "dashboard" %}

{% block title %}Vigil — Launch Run{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Launch Red-Team Run</h1>

    <form id="launch-form" class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-6">
        <div>
            <label class="text-sm font-semibold text-gray-300 block mb-2">Behavior</label>
            <select name="behavior" id="behavior"
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 focus:border-vigil-500 focus:outline-none">
            </select>
        </div>

        <div>
            <label class="text-sm font-semibold text-gray-300 block mb-2">Target Model</label>
            <input type="text" name="target_model" value="meta-llama/llama-3.3-70b-instruct"
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 focus:border-vigil-500 focus:outline-none font-mono">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-sm font-semibold text-gray-300 block mb-2">Attacker Model</label>
                <input type="text" name="attacker_model" value="anthropic/claude-sonnet-4"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 focus:border-vigil-500 focus:outline-none font-mono">
            </div>
            <div>
                <label class="text-sm font-semibold text-gray-300 block mb-2">Judge Model</label>
                <input type="text" name="judge_model" value="anthropic/claude-sonnet-4"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 focus:border-vigil-500 focus:outline-none font-mono">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-sm font-semibold text-gray-300 block mb-2">Scenarios</label>
                <input type="number" name="num_scenarios" value="3" min="1" max="20"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 focus:border-vigil-500 focus:outline-none">
            </div>
            <div>
                <label class="text-sm font-semibold text-gray-300 block mb-2">Turns per scenario</label>
                <input type="number" name="num_turns" value="8" min="2" max="20"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-sm text-gray-200 focus:border-vigil-500 focus:outline-none">
            </div>
        </div>

        <button type="submit"
            class="w-full bg-vigil-600 hover:bg-vigil-700 text-white font-medium py-3 rounded-lg transition-colors">
            Launch Run
        </button>

        <div id="launch-status" class="hidden text-center text-sm text-vigil-400"></div>
    </form>
</div>

<script>
    // Load behaviors
    fetch('/api/behaviors').then(r => r.json()).then(behaviors => {
        const select = document.getElementById('behavior');
        for (const [key, val] of Object.entries(behaviors)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = `${val.name} (${val.severity})`;
            select.appendChild(opt);
        }
    });

    // Handle form submission
    document.getElementById('launch-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const data = {
            behavior: form.behavior.value,
            target_model: form.target_model.value,
            attacker_model: form.attacker_model.value,
            judge_model: form.judge_model.value,
            num_scenarios: parseInt(form.num_scenarios.value),
            num_turns: parseInt(form.num_turns.value),
        };
        const status = document.getElementById('launch-status');
        status.classList.remove('hidden');
        status.textContent = 'Launching...';

        const resp = await fetch('/api/runs/launch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        const result = await resp.json();
        status.textContent = `Run ${result.run_id} started! Redirecting...`;
        setTimeout(() => window.location.href = `/redteam/runs/${result.run_id}`, 2000);
    });
</script>
{% endblock %}
